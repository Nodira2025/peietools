<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-peie.png" />
    <link rel="apple-touch-icon" href="/logo-peie.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PEIE Tools</title>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background-color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;gap:1.25rem">
        <div style="position:relative;display:flex;align-items:center;justify-content:center">
          <div style="position:absolute;width:4.5rem;height:4.5rem;border-radius:50%;border:3px solid transparent;border-top-color:#0ea5e9;border-right-color:#f59e0b;animation:spin 1.2s linear infinite"></div>
          <div style="position:relative;z-index:10;width:3rem;height:3rem;background:#ffffff;border-radius:1rem;padding:0.4rem;box-shadow:0 10px 25px -5px rgba(14,165,233,0.3);display:flex;align-items:center;justify-content:center;animation:pulse 1.8s cubic-bezier(0.4,0,0.6,1) infinite">
            <img src="/logo-peie.png" alt="PEIE Tools" style="width:100%;height:100%;object-fit:contain" />
          </div>
        </div>
        <p style="font-size:0.875rem;color:#031530;font-weight:800;letter-spacing:0.05em;margin:0;animation:pulse 1.8s cubic-bezier(0.4,0,0.6,1) infinite">Cargando PEIE Tools...</p>
      </div>
    </div>
    <style>
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.6; transform:scale(0.96); } }
    </style>
    <script>
      // Force SW cache refresh on deploy - bump this version with each critical deploy
      (function(){
        var CACHE_V = 'v2026-08-14-categories-v2';
        var KEY = 'peie_cache_v';
        var stored = localStorage.getItem(KEY);
        if (stored !== CACHE_V) {
          localStorage.setItem(KEY, CACHE_V);
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              var p = regs.map(function(r) { return r.unregister(); });
              return Promise.all(p);
            }).then(function() {
              return caches.keys();
            }).then(function(names) {
              return Promise.all(names.map(function(n) { return caches.delete(n); }));
            }).then(function() {
              if (stored !== null) { location.reload(); }
            }).catch(function() {});
          }
        }
      })();
    </script>
    <script>
      function __showErr(msg){
        var r=document.getElementById('root');
        if(!r)return;
        r.innerHTML='<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui;padding:2rem"><div style="background:#fff;border-radius:1rem;padding:2rem;max-width:480px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,.08);text-align:center"><div style="font-size:3rem;margin-bottom:1rem">⚠️</div><h1 style="font-size:1.25rem;font-weight:700;color:#1e293b;margin-bottom:.5rem">Algo salió mal</h1><p style="font-size:.875rem;color:#64748b;margin-bottom:1rem">Ocurrió un error inesperado.</p><button onclick="location.reload()" style="background:#3b82f6;color:#fff;border:none;border-radius:.75rem;padding:.75rem 1.5rem;font-size:.875rem;font-weight:600;cursor:pointer">Recargar</button><details style="text-align:left;margin-top:1rem"><summary style="cursor:pointer;font-size:.75rem;color:#94a3b8;font-weight:600">Detalles</summary><pre style="background:#f1f5f9;border-radius:.5rem;padding:.75rem;font-size:.65rem;color:#ef4444;overflow:auto;max-height:200px;margin-top:.5rem;white-space:pre-wrap;word-break:break-all">'+msg+'</pre></details></div></div>';
      }
      window.addEventListener('error',function(e){__showErr(e.message+'\n\nFile: '+(e.filename||'?')+':'+(e.lineno||'?')+':'+(e.colno||'?'));});
      window.addEventListener('unhandledrejection',function(e){__showErr('Unhandled Promise: '+(e.reason&&e.reason.message||e.reason||'Unknown'));});
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
